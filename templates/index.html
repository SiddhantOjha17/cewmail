<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cewmail</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>cewmail</h1>
  </header>

  <div class="tab-bar">
    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="compose" role="tab">Compose</button>
      <button class="tab-btn" data-tab="inbox" role="tab">Inbox</button>
    </div>
  </div>

  <main>
    <section id="tab-compose" class="tab-panel active">
      <div id="reply-banner" class="reply-banner" hidden>
        Replying to <strong id="reply-banner-from"></strong>
        <button id="reply-cancel" type="button" class="link-btn">cancel</button>
      </div>

      <form id="compose-form">
        <div class="field-row">
          <label for="category">Category</label>
          <div class="category-row">
            <select id="category" name="category">
              <option value="">General (no template)</option>
              {% for c in categories %}
              <option value="{{ c.name }}">{{ c.label }}</option>
              {% endfor %}
            </select>
            <button type="button" id="add-category-btn" class="secondary-btn">+ Add category</button>
          </div>
        </div>

        <div id="add-category-form" class="card" hidden>
          <label for="new-category-name">New category name</label>
          <input type="text" id="new-category-name" placeholder="e.g. renewal">
          <label for="new-category-template">Template instructions</label>
          <textarea id="new-category-template" rows="5" placeholder="Describe tone/structure for this category..."></textarea>
          <div class="btn-row">
            <button type="button" id="save-category-btn" class="primary-btn">
              <span class="btn-label">Save category</span>
            </button>
            <button type="button" id="cancel-category-btn" class="link-btn">cancel</button>
          </div>
          <p id="add-category-error" class="error-text" hidden></p>
        </div>

        <div class="field-row">
          <label for="recipient">Recipient</label>
          <input type="email" id="recipient" name="recipient" placeholder="someone@example.com" required>
        </div>

        <div class="field-row">
          <label for="context">Context for this email</label>
          <textarea id="context" name="context" rows="4" placeholder="What does this email need to say?" required></textarea>
        </div>

        <div class="field-row">
          <label for="attachments">Attachments (optional)</label>
          <input type="file" id="attachments" name="attachments" multiple>
        </div>

        <button type="button" id="generate-btn" class="primary-btn">
          <span class="btn-label">Generate drafts</span>
        </button>
        <p id="generate-error" class="error-text" hidden></p>
      </form>

      <section id="drafts-section" hidden>
        <h2>Pick a draft</h2>
        <p id="backend-note" class="muted-text" hidden></p>
        <div id="drafts-list" class="drafts-list"></div>
      </section>

      <section id="editor-section" hidden>
        <h2>Edit &amp; send</h2>
        <label for="edit-subject">Subject</label>
        <input type="text" id="edit-subject">
        <label for="edit-body">Body</label>
        <textarea id="edit-body" rows="10"></textarea>

        <div class="tweak-box card">
          <h3>Tweak this draft</h3>
          <div class="chip-row" id="tweak-chips">
            <button type="button" class="chip" data-tweak="Make it noticeably shorter and more to the point.">Shorter</button>
            <button type="button" class="chip" data-tweak="Make the tone more formal and professional.">More formal</button>
            <button type="button" class="chip" data-tweak="Make the tone more casual and friendly.">More casual</button>
            <button type="button" class="chip" data-tweak="Add a bit more detail and context.">More detailed</button>
            <button type="button" class="chip" data-tweak="Make it sound warmer and friendlier.">Friendlier</button>
            <button type="button" class="chip" data-tweak="Fix any grammar or wording issues, keep meaning the same.">Fix grammar</button>
          </div>
          <div class="custom-tweak-row">
            <input type="text" id="custom-tweak-input" placeholder="Or describe your own tweak...">
            <button type="button" id="apply-custom-tweak-btn" class="secondary-btn">
              <span class="btn-label">Apply</span>
            </button>
          </div>
          <p id="tweak-error" class="error-text" hidden></p>
        </div>

        <h3 class="preview-heading">Preview -- exactly what will be sent</h3>
        <div class="email-preview card">
          <div class="preview-meta">
            <div><span class="preview-label">To</span><span id="preview-recipient">—</span></div>
            <div><span class="preview-label">Subject</span><span id="preview-subject">—</span></div>
          </div>
          <div id="preview-body" class="preview-body"></div>
          <div id="preview-signature" class="preview-signature"></div>
        </div>

        <button type="button" id="send-btn" class="primary-btn">
          <span class="btn-label">Send</span>
        </button>
        <p id="send-error" class="error-text" hidden></p>
      </section>

      <template id="signature-template">{{ signature_html | safe }}</template>

      <section id="confirmation-section" hidden>
        <div id="confirmation-box" class="card"></div>
        <button type="button" id="new-email-btn" class="secondary-btn">Compose another</button>
      </section>
    </section>

    <section id="tab-inbox" class="tab-panel">
      <div class="btn-row">
        <button type="button" id="refresh-inbox-btn" class="secondary-btn">
          <span class="btn-label">Refresh</span>
        </button>
      </div>
      <p id="inbox-error" class="error-text" hidden></p>
      <ul id="inbox-list" class="inbox-list"></ul>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
